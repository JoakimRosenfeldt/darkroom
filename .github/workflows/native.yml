name: Native app

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renderer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:renderer
      - run: npm test

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append'
      - run: npm ci
      - run: npm run build
      - name: Linux package
        if: runner.os == 'Linux'
        run: npx tauri bundle --bundles deb --ci
      - name: Windows package
        if: runner.os == 'Windows'
        run: npx tauri bundle --bundles nsis --ci
      - run: cargo build --manifest-path src-tauri/Cargo.toml --release --features diagnostics --bin darkroom-backend --locked
      - name: Linux desktop workflow
        if: runner.os == 'Linux'
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          DARKROOM_SMOKE_REQUIRE_GPU: 1
          DARKROOM_SMOKE_REQUIRE_NATIVE: 1
        run: |
          sudo apt-get install -y xvfb webkit2gtk-driver mesa-vulkan-drivers
          cargo install tauri-driver --locked
          cargo build --manifest-path src-tauri/Cargo.toml --features diagnostics --bin darkroom --locked
          npm run dev > /tmp/darkroom-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID"' EXIT
          xvfb-run -a -s '-screen 0 1600x1000x24' node scripts/develop-workflow-smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: darkroom-${{ runner.os }}-${{ runner.arch }}
          path: |
            src-tauri/target/release/darkroom
            src-tauri/target/release/darkroom.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux' && always()
        with:
          name: desktop-workflow-evidence
          path: |
            /tmp/darkroom-develop-smoke-*/report.json
            /tmp/darkroom-develop-smoke-*/*.png
            /tmp/darkroom-develop-smoke-*/driver.log
            /tmp/darkroom-vite.log
